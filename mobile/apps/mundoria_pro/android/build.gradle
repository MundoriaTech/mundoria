allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { subproject ->
    // Flutter 3.24 does not expose the flutter Gradle extension to Android libraries.
    // Plugins such as geolocator_android read it while their android block is evaluated.
    subproject.plugins.withId("com.android.library") {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null && !androidExt.hasProperty("flutter")) {
            androidExt.ext.flutter = [
                compileSdkVersion: 34,
                minSdkVersion    : 21,
                targetSdkVersion : 34,
                ndkVersion       : "23.1.7779620",
                versionCode      : 1,
                versionName      : "1.0",
            ]
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
